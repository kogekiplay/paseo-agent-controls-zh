<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Agent Controls Chinese · Isolated preview</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:48px;background:#fafafa;color:#202124;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{max-width:1030px;margin:auto auto 32px}h1{margin:0 0 10px;font-size:30px;font-weight:650}header p{color:#767780;font-size:14px;margin:0}.samples{display:flex;gap:32px;max-width:1030px;margin:auto}.sample{flex:1;min-width:0}h2{font-size:20px;margin:0 0 18px}.menu{border:1px solid #dedee4;border-radius:14px;background:white;padding:10px;box-shadow:0 10px 24px #00000006;min-height:328px}.option{display:flex;align-items:center;gap:13px;height:51px;padding:0 14px;border-radius:7px}.option:nth-child(5){background:#f6f6f8}.icon{color:#64666c;width:22px;height:22px;flex:none}.check{margin-left:auto;color:#7a7b83}.composer{margin-top:20px;border:1px solid #e3e3e9;border-radius:16px;background:#fff;padding:18px 15px}.placeholder{font-size:14px;color:#b2b2b9;margin:0 0 28px}.toolbar{display:flex;gap:15px;align-items:center}button{border:0;background:none;font:inherit;color:#75767e;padding:0;display:flex;align-items:center;gap:7px;white-space:nowrap}.model{font-size:14px}.caret{font-size:12px;margin-left:3px}footer{max-width:1030px;margin:28px auto 0;color:#878891;font-size:12px;line-height:1.7}.legend{font-size:12px;color:#8a8c94;margin-top:12px}.status{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:#777983}.dot{width:6px;height:6px;border-radius:50%;background:#29946e}
</style>
<header><div class="status"><span class="dot"></span> PASEO PLUGIN · 简体中文</div><h1 style="margin-top:12px">Agent 控件中文</h1><p>思考强度、权限模式、速度和计划模式的中文显示</p></header>
<main class="samples" id="samples"></main><footer>Isolated interface preview using sample controls and this plugin’s actual translation engine.<br>Codex retains its existing names. Claude Code follows javaht/claude-desktop-zh-cn; the final level displays as Ultracode for Claude Code.</footer>
<script type="module">
import { install } from './client/web.js';
const brain='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 18V5a3 3 0 0 0-5.8-1 4 4 0 0 0-3 6.5A4 4 0 0 0 6 17.8 3 3 0 0 0 12 18Zm0 0V5a3 3 0 0 1 5.8-1 4 4 0 0 1 3 6.5 4 4 0 0 1-2.8 7.3A3 3 0 0 1 12 18ZM6.2 4c0 2.5 1.3 3 2.3 3M17.8 4c0 2.5-1.3 3-2.3 3M3.2 10.5C5 10 6 11 6 12M20.8 10.5C19 10 18 11 18 12"/></svg>';
const levels=['Low','Medium','High','Extra high','Max','Ultra'];
for(const provider of ['codex','claude']){
  const section=document.createElement('section');section.className='sample';section.setAttribute('data-testid','workspace-pane-'+provider);
  section.innerHTML=`<h2>${provider==='codex'?'Codex':'Claude Code'}</h2><span data-testid="workspace-tab-agent_${provider}" aria-selected="true"></span><div class="menu" data-testid="combobox-desktop-container">${levels.map(level=>`<div class="option">${brain}<span>${level}</span>${level==='Max'?'<span class="check">✓</span>':''}</div>`).join('')}</div><div class="composer" data-testid="message-input-root"><p class="placeholder">给 Agent 发消息…</p><div class="toolbar"><button class="model" data-testid="combined-model-selector">${provider==='codex'?'GPT-6.1':'Opus 5.5'}</button><button data-testid="agent-thinking-selector" id="${provider}" aria-label="Select thinking option (Max)">${brain}<span>Max</span><span class="caret">⌄</span></button><button data-testid="mode-control"><span>${provider==='codex'?'Full access':'Bypass'}</span><span class="caret">⌄</span></button></div></div><p class="legend">${provider==='codex'?'轻度 · 中 · 高 · 极高 · 最大 · Ultra':'低 · 中 · 高 · 极高 · 最高 · Ultracode'}</p>`;
  document.getElementById('samples').append(section);
}
// Open each portal after its source trigger to exercise real provider-scoped translation.
const engine=install(true,id=>id);
for(const provider of ['codex','claude']){
  const section=document.querySelector(`[data-testid="workspace-pane-${provider}"]`);
  const menu=section.querySelector('.menu');menu.remove();
  section.querySelector('[data-testid="agent-thinking-selector"]').dispatchEvent(new Event('pointerdown',{bubbles:true}));
  section.insertBefore(menu,section.querySelector('.composer'));
  await new Promise(resolve=>setTimeout(resolve,0));
}
document.documentElement.dataset.verified='true';
</script></html>
